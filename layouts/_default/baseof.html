<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ site.Title }}</title>
  <link rel="stylesheet" href="{{ "css/common/style.css?v=2" | relURL }}" />
  {{ if .IsHome }}
    <link rel="stylesheet" href="{{ "css/common/home.css?v=1" | relURL }}" />
  {{ end }}
  {{ if and (eq .Section "map") (eq .Kind "page") }}
    <link rel="stylesheet" href="{{ "css/common/map.css?v=1" | relURL }}" />
  {{ end }}
  {{ if eq .Layout "tenku" }}
    <link rel="stylesheet" href="{{ "css/common/tenku.css?v=1" | relURL }}" />
  {{ end }}
  {{ if eq .Layout "guide" }}
    <link rel="stylesheet" href="{{ "css/common/guide.css?v=1" | relURL }}" />
  {{ end }}
  {{ with .Site.Config.Services.GoogleAnalytics.ID }}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ . }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ . }}');
  </script>
  {{ end }}
</head>
<body>
  {{ partial "header.html" . }}
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <script src="{{ "js/common/header-nav.js?v=1" | relURL }}" defer></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.addEventListener("focus", function (e) {
    if (e.target && e.target.tagName === "INPUT" && e.target.type === "number") {
      e.target.select();
    }
  }, true);
});
</script>
</body>
</html>
