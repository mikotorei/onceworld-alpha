{{ define "main" }}
<div class="exp-calc">

<h1>{{ .Title }}</h1>

<div class="exp-tabs">
<button class="exp-tab-btn" data-tab="hero" aria-pressed="true">主人公</button>
<button class="exp-tab-btn" data-tab="pet" aria-pressed="false">ペット</button>
</div>

<!-- 主人公パネル -->
<div class="exp-panel" data-panel="hero">
<div class="exp-section">
<div class="exp-section-title">レベル設定</div>
<div class="exp-row">
<span class="exp-label">現在Lv</span>
<input id="heroFromLv" type="number" class="exp-input" min="1" max="200" value="1">
</div>
<div class="exp-row">
<span class="exp-label">目標Lv</span>
<input id="heroToLv" type="number" class="exp-input" min="2" max="200" value="200">
</div>
</div>

<div class="exp-section">
<div class="exp-section-title">追加情報</div>
<div class="exp-row">
<span class="exp-label">天命輪廻回数（上限30）</span>
<input id="heroTenme" type="number" class="exp-input" min="0" max="30" value="0">
<span class="exp-unit">回</span>
</div>
<div class="exp-row">
<span class="exp-label">古のティラピス像（上限1000）</span>
<input id="heroTilapia" type="number" class="exp-input" min="0" max="1000" value="0">
<span class="exp-unit">個</span>
</div>
</div>
</div>

<!-- ペットパネル -->
<div class="exp-panel" data-panel="pet" style="display:none">
<div class="exp-section">
<div class="exp-section-title">ペット選択</div>
<div class="exp-row">
<span class="exp-label">モンスター</span>
<div class="exp-search-wrap">
<input id="petMonsterSearch" type="search" placeholder="名前で検索して選択" autocomplete="off">
<div id="petMonsterSuggest" class="exp-suggest" hidden></div>
</div>
</div>
</div>

<div class="exp-section">
<div class="exp-section-title">レベル設定</div>
<div class="exp-row">
<span class="exp-label">現在Lv</span>
<input id="petFromLv" type="number" class="exp-input" min="1" max="1200" value="1">
</div>
<div class="exp-row">
<span class="exp-label">目標Lv</span>
<input id="petToLv" type="number" class="exp-input" min="2" max="1200" value="200">
</div>
</div>

<div class="exp-section">
<div class="exp-section-title">追加情報</div>
<div class="exp-row">
<span class="exp-label">殲儀回数（上限30）</span>
<input id="petTenme" type="number" class="exp-input" min="0" max="30" value="0">
<span class="exp-unit">回</span>
</div>
<div class="exp-row">
<span class="exp-label">古のティラピス像（上限1000）</span>
<input id="petTilapia" type="number" class="exp-input" min="0" max="1000" value="0">
<span class="exp-unit">個</span>
</div>
</div>
</div>

<div id="expError" class="exp-error"></div>
<button id="expCalcBtn" type="button" class="exp-calc-btn">計算する</button>

<!-- 結果 -->
<div id="expResult" class="exp-result" style="display:none">
<div class="exp-result-title">必要経験値合計</div>
<div id="expResultValue" class="exp-result-value"></div>
<div id="expResultMult" class="exp-result-detail" style="margin-top:8px;font-size:13px;color:#555;"></div>
<div id="expResultBaseExp" class="exp-result-detail" style="font-size:13px;color:#555;"></div>
<div class="exp-result-detail">
<table>
<thead><tr><th>レベル</th><th>必要EXP</th></tr></thead>
<tbody id="expResultTableBody"></tbody>
</table>
</div>
</div>

<!-- 討伐数計算 -->
<div id="huntCalc" class="exp-section" style="display:none">
<div class="exp-section-title">討伐数計算（任意）</div>
<div class="exp-row">
<span class="exp-label">経験の起源</span>
<div class="exp-toggle-group">
<button type="button" class="exp-toggle-btn" id="hasKigen" data-val="0" aria-pressed="false">未所持</button>
<button type="button" class="exp-toggle-btn active" id="hasKigenOn" data-val="1" aria-pressed="false">所持（×2）</button>
</div>
</div>
<div class="exp-row">
<span class="exp-label">ベガサスのメダル個数</span>
<input id="medalCount" type="number" class="exp-input" min="0" max="1000" value="0">
</div>
<div id="petHuntRows" style="display:none">
<div class="exp-row">
<span class="exp-label">ジパングの酒個数（上限1000）</span>
<input id="zipangCount" type="number" class="exp-input" min="0" max="1000" value="0">
</div>
<div class="exp-row">
<span class="exp-label">ルミナスキノコ個数（上限1000）</span>
<input id="luminousCount" type="number" class="exp-input" min="0" max="1000" value="0">
</div>
<div class="exp-row">
<span class="exp-label">キノコハウス</span>
<div class="exp-toggle-group">
<button type="button" class="exp-toggle-btn active" id="noHouse" aria-pressed="false">なし</button>
<button type="button" class="exp-toggle-btn" id="hasHouse" aria-pressed="false">あり（×100）</button>
</div>
</div>
</div>
<div class="exp-row">
<span class="exp-label">討伐モンスター</span>
<div class="exp-search-wrap">
<input id="huntMonsterSearch" type="search" placeholder="名前で検索して選択" autocomplete="off">
<div id="huntMonsterSuggest" class="exp-suggest" hidden></div>
</div>
</div>
<div class="exp-row">
<span class="exp-label">基礎経験値</span>
<input id="monsterBaseExp" type="number" class="exp-input" min="1" value="0" readonly style="background:#f5f5f5;color:#555">
</div>
<div id="huntResult" class="exp-hunt-result" style="display:none">
<div class="exp-hunt-row"><span>1体あたりの獲得経験値</span><span id="huntExpPerKill" class="exp-hunt-val"></span></div>
<div class="exp-hunt-row"><span>必要討伐数</span><span id="huntKillCount" class="exp-hunt-val blue"></span></div>
</div>
<div id="huntError" class="exp-error" style="display:none"></div>
<button type="button" id="huntCalcBtn" class="exp-calc-btn" style="margin-top:12px">討伐数を計算</button>
</div>

</div>

<link rel="stylesheet" href="{{ "css/tools/exp-calc/exp-calc.css" | relURL }}">
<script src="{{ "monsters-data.js" | relURL }}"></script>
<script src="{{ "js/tools/exp-calc/exp-calc.js" | relURL }}" defer></script>
{{ end }}
