<header class="ow-header" id="owHeader">
  <div class="ow-header-inner">
    <div class="ow-header-left" aria-hidden="true"></div>

    <div class="ow-header-title">
      <a href="{{ .Site.Home.RelPermalink }}">続・巫女とワンスワ攻略</a>
    </div>

    <div class="ow-header-right">
      <button
        class="ow-hamburger"
        type="button"
        aria-label="メニューを開く"
        aria-controls="owMenu"
        aria-expanded="false"
      >
        <span class="ow-hamburger-bars" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <nav class="ow-menu" id="owMenu" aria-label="サイトメニュー" hidden>
    <div class="ow-menu-header">
      <span>巫女攻alpha</span>
      <button class="ow-menu-close" id="owMenuClose" aria-label="メニューを閉じる">✕</button>
    </div>

    <div class="ow-menu-section">
      <a href="{{ .Site.Home.Permalink }}">🏠 ホーム</a>
    </div>

    <div class="ow-menu-section">
      {{ $pages := where .Site.Pages "Params.home" true }}
      {{ range $pages.ByWeight }}
        <a href="{{ .Permalink }}">{{ .Title }}</a>
      {{ end }}
    </div>
  </nav>

  <div class="ow-overlay" id="owOverlay" hidden></div>
</header>
